<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScreenX 3D Viewer</title>
<style>
  :root{--bg:#0b0b0d;--panel:rgba(18,18,22,.88);--fg:#e8e8ec;--mut:#8b8b96;--acc:#e5a23a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #side{position:fixed;top:0;left:0;bottom:0;width:260px;box-sizing:border-box;padding:14px;background:var(--panel);
    backdrop-filter:blur(8px);overflow:auto;transition:transform .2s;z-index:2;padding-top:max(14px,env(safe-area-inset-top))}
  #side.hide{transform:translateX(-100%)}
  #tog{position:fixed;top:max(10px,env(safe-area-inset-top));left:272px;z-index:3;width:34px;height:34px;border-radius:8px;
    border:0;background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer;transition:left .2s}
  #side.hide+#tog{left:10px}
  h1{font-size:14px;margin:0 0 12px}
  h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
  label{display:flex;justify-content:space-between;color:var(--mut);margin-top:8px}
  label b{color:var(--fg);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--acc)}
  button.b,label.file{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:8px;border:1px solid #33333a;border-radius:8px;
    background:#1b1b21;color:var(--fg);cursor:pointer;text-align:center}
  button.b:hover,label.file:hover{border-color:var(--acc)}
  button.vr{background:var(--acc);color:#111;border:0;font-weight:600;padding:11px}
  .row{display:flex;gap:6px}
  #status{margin-top:10px;color:var(--mut);font-size:12px;min-height:16px}
  #exit{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;
    padding:6px 14px;border:0;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
  body.split #side,body.split #tog{display:none}
  body.split #exit{display:block}
  video{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<aside id="side">
  <h1>ScreenX 3D Viewer</h1>
  <button class="b vr" id="vr">Enter VR Split Screen Mode</button>
  <button class="b" id="xr">Enter VR</button>

  <h2>Video</h2>
  <div class="row">
    <button class="b" id="pp">Pause</button>
    <button class="b" id="mute">Unmute</button>
  </div>
  <div id="status">Loading…</div>
</aside>
<button id="tog" title="Toggle sidebar">☰</button>
<button id="exit">✕ Exit split mode</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);
const S = { fov: 70, seatZ: 38, scale: 0.113, offU: 0.5, offV: -0.498, yaw: 0, pitch: 0, split: false };
const DEFAULT_SEAT_Z = 38;               // used when the exported camera node sits on the screen plane
const seat = new THREE.Vector3(0, 0, DEFAULT_SEAT_Z);

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050506);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.25));
const lights = [-20, 0, 20].map(x => {
  const l = new THREE.PointLight(0xffffff, 1.5, 0, 0);
  l.position.set(x, 0, 12);
  scene.add(l);
  return l;
});

const FOV_NORMAL = 70, FOV_SPLIT = 100;
const camera = new THREE.PerspectiveCamera(FOV_NORMAL, 1, 0.1, 400);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group();           // seat position; moves the camera (and the headset in VR)
rig.add(camera); scene.add(rig);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');

/* ---------- video + shared screen material ---------- */
const video = document.createElement('video');
document.body.appendChild(video);
Object.assign(video, { src: 'doomsday.mp4', loop: true, muted: true, playsInline: true, crossOrigin: 'anonymous' });
video.addEventListener('error', () => $('status').textContent = 'Video failed to load (doomsday.mp4). Use "Load another video…".');
video.addEventListener('loadstart', () => video.play().catch(() => {}));
const tex = new THREE.VideoTexture(video);
tex.colorSpace = THREE.SRGBColorSpace;
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
const screenMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, toneMapped: false });

/* ---------- GLB ---------- */
const screens = [];
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
new GLTFLoader().setDRACOLoader(draco).load('screenx.glb', gltf => {
  scene.add(gltf.scene);
  gltf.scene.updateMatrixWorld(true);
  let target = null;
  gltf.scene.traverse(o => {
    if (/camera.*target/i.test(o.name)) target = o;
    if (!o.isMesh) return;
    if (['main', 'left', 'right'].includes(o.name)) {
      const pos = o.geometry.attributes.position;
      o.geometry.userData.local = Float32Array.from(pos.array);
      o.geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(pos.count * 2), 2));
      o.material = screenMat;
      screens.push(o);
    } else {
      o.material = new THREE.MeshStandardMaterial({
        color: 0x050505, // Change to 0x000000 for pure black
        roughness: 0.9,
        metalness: 0.1,
        side: THREE.DoubleSide
  });
    }
  if (target) {                                // camera position = Camera Location Target Point
    const p = target.getWorldPosition(new THREE.Vector3());
    seat.set(p.x, p.y, Math.abs(p.z) < 5 ? DEFAULT_SEAT_Z : p.z);
    S.seatZ = seat.z;
  }
  applyMapping();
  $('status').textContent = 'Drag to look around';
}, undefined, e => $('status').textContent = 'GLB failed to load: ' + (e.message || e));

/* Blender "Texture Coordinate: Object → Mapping (Point)": uv = objectCoord * scale + location.
   Blender (x, y) = glTF (x, -z), so the three screens form one continuous strip. */
function applyMapping() {
  for (const m of screens) {
    const loc = m.geometry.userData.local, uv = m.geometry.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      uv.setXY(i, loc[i * 3] * S.scale + S.offU, -loc[i * 3 + 2] * S.scale + S.offV);
    }
    uv.needsUpdate = true;
  }
}

/* ---------- light spill from the video onto the walls ---------- */
const sc = document.createElement('canvas'); sc.width = 3; sc.height = 1;
const sctx = sc.getContext('2d', { willReadFrequently: true });
setInterval(() => {
  if (video.readyState < 2 || !video.videoWidth) return;
  try {
    const w = video.videoWidth, h = video.videoHeight;
    const vc = ((S.offV % 1) + 1) % 1;
    const sy = Math.max(0, (1 - vc - S.scale) * h), sh = Math.min(h - sy, 2 * S.scale * h);
    sctx.drawImage(video, 0, sy, w, Math.max(1, sh), 0, 0, 3, 1);
    const d = sctx.getImageData(0, 0, 3, 1).data;
    lights.forEach((l, i) => l.color.setRGB(d[i * 4] / 255, d[i * 4 + 1] / 255, d[i * 4 + 2] / 255, THREE.SRGBColorSpace));
  } catch (e) { /* tainted or not ready */ }
}, 150);

/* ---------- look controls ---------- */
const cv = renderer.domElement;
let drag = null;
cv.addEventListener('pointerdown', e => { if (S.split && gyro.has) { gyro.cal = false; return; } drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || (S.split && gyro.has)) return;
  const k = 0.0045;
  S.yaw -= (e.clientX - drag.x) * k;
  S.pitch = Math.max(-1.45, Math.min(1.45, S.pitch - (e.clientY - drag.y) * k));
  drag = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointerup', () => drag = null);

/* ---------- device orientation (drives the camera in split mode) ---------- */
const gyro = { has: false, cal: false, yawOff: new THREE.Quaternion(), q: new THREE.Quaternion() };
const _e = new THREE.Euler(), _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2),
      _q0 = new THREE.Quaternion(), _zee = new THREE.Vector3(0, 0, 1), _up = new THREE.Vector3(0, 1, 0);
function onOrient(e) {
  if (!S.split || e.alpha == null || e.beta == null || e.gamma == null) return;
  const r = THREE.MathUtils.degToRad;
  const orient = r(screen.orientation?.angle ?? window.orientation ?? 0);
  _e.set(r(e.beta), r(e.alpha), -r(e.gamma), 'YXZ');
  gyro.q.setFromEuler(_e).multiply(_q1).multiply(_q0.setFromAxisAngle(_zee, -orient));
  if (!gyro.cal) {                       // face the screen on entry / tap
    _e.setFromQuaternion(gyro.q, 'YXZ');
    gyro.yawOff.setFromAxisAngle(_up, -_e.y);
    gyro.cal = true;
  }
  gyro.q.premultiply(gyro.yawOff);
  gyro.has = true;
}
async function startGyro() {             // must run inside the click gesture (iOS permission)
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') {
    try { if (await D.requestPermission() !== 'granted') return; } catch (e) { return; }
  }
  removeEventListener('deviceorientation', onOrient);
  addEventListener('deviceorientation', onOrient);
}

/* ---------- VR split: render once, mirror into both halves ---------- */
const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 });
const blitMat = new THREE.MeshBasicMaterial({ map: rt.texture, depthTest: false, depthWrite: false, toneMapped: false });
const blitQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat);
blitQuad.frustumCulled = false;
const blitScene = new THREE.Scene(); blitScene.add(blitQuad);
const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function enterSplit() {
  startGyro();
  gyro.has = false; gyro.cal = false;
  S.split = true;
  document.body.classList.add('split');
  document.documentElement.requestFullscreen?.().catch(() => {});
  screen.orientation?.lock?.('landscape').catch(() => {});
}
function exitSplit() {
  if (!S.split) return;
  S.split = false;
  gyro.has = false; gyro.cal = false;
  document.body.classList.remove('split');
  renderer.setScissorTest(false);
  renderer.autoClear = true;
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  screen.orientation?.unlock?.();
}
addEventListener('keydown', e => { if (e.key === 'Escape') exitSplit(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) exitSplit(); });

function render() {
  rig.position.set(seat.x, seat.y, S.seatZ);
  if (renderer.xr.isPresenting) { renderer.render(scene, camera); return; }   // headset drives camera + FOV
  camera.fov = S.split ? FOV_SPLIT : FOV_NORMAL;
  if (S.split && gyro.has) camera.quaternion.copy(gyro.q);
  else camera.rotation.set(S.pitch, S.yaw, 0);
  const W = innerWidth, H = innerHeight;
  if (!S.split) { camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.render(scene, camera); return; }

  const even = W - (W % 2), half = even / 2, xo = W - even, pr = renderer.getPixelRatio();
  const pw = Math.max(1, Math.round(half * pr)), ph = Math.max(1, Math.round(H * pr));
  if (rt.width !== pw || rt.height !== ph) rt.setSize(pw, ph);
  camera.aspect = half / H; camera.updateProjectionMatrix();
  renderer.setScissorTest(false);
  renderer.autoClear = false;
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, camera); renderer.setRenderTarget(null);
  renderer.clear();
  renderer.setScissorTest(true);
  for (const x of [xo, xo + half]) {
    renderer.setViewport(x, 0, half, H); renderer.setScissor(x, 0, half, H);
    renderer.render(blitScene, blitCam);
  }
  renderer.setScissorTest(false);
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(render);

/* ---------- sidebar ---------- */
$('vr').onclick = enterSplit;
const xrBtn = $('xr');
const xrOff = t => { xrBtn.disabled = true; xrBtn.textContent = t; xrBtn.style.opacity = .5; };
if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (!ok) xrOff('VR headset not available'); }).catch(() => xrOff('VR headset not available'));
else xrOff('VR headset not available');
xrBtn.onclick = async () => {
  const cur = renderer.xr.getSession();
  if (cur) { cur.end(); return; }
  try {
    exitSplit();
    const sess = await navigator.xr.requestSession('immersive-vr');
    sess.addEventListener('end', () => { xrBtn.textContent = 'Enter VR'; });
    await renderer.xr.setSession(sess);
    xrBtn.textContent = 'Exit VR';
  } catch (e) { $('status').textContent = 'Could not start VR: ' + (e.message || e); }
};
$('exit').onclick = exitSplit;
$('tog').onclick = () => $('side').classList.toggle('hide');
$('pp').onclick = () => { video.paused ? video.play() : video.pause(); $('pp').textContent = video.paused ? 'Play' : 'Pause'; };
$('mute').onclick = () => { video.muted = !video.muted; $('mute').textContent = video.muted ? 'Unmute' : 'Mute'; if (!video.muted) video.play(); };
</script>
</body>
</html>
